name: transly_ai
description: "Transly AI — bilingual AI-powered translation app (Arabic / English)."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1

  # DI
  get_it: ^8.0.3

  # Navigation
  go_router: ^15.1.2

  # Networking
  dio: ^5.8.0+1

  # Local Storage
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4

  upgrader: ^13.7.0

  equatable: ^3.0.0

  # ML Kit — translation
  google_mlkit_translation: ^0.12.0

  # Speech
  flutter_tts: ^4.2.2

  # Connectivity
  connectivity_plus: ^6.1.4

  # Fonts
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.2

  cupertino_icons: ^1.0.8
  pretty_dio_logger: ^1.4.0
  firebase_core: ^4.13.0
  flutter_secure_storage: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4

  hive_ce_generator: ^1.11.1
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

# Launcher icons — regenerate with `dart run flutter_launcher_icons`.
#
# Heads up: v0.14.4 rewrites the first `ASSETCATALOG_COMPILER_*` line it finds in
# each iOS build configuration, which flips
# `ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS` from `YES` to
# `AppIcon`. That key is a boolean — revert `ios/Runner.xcodeproj/project.pbxproj`
# after every run; the icons themselves live in the asset catalog, not there.
#
# `app_icon.png` is the master artwork (rounded tile on transparent). The three
# layers beside it are derived from it: iOS and Windows need a square, opaque,
# un-rounded icon because both platforms apply their own corner mask, and
# Android's adaptive icon needs the gradient and the mark as separate layers so
# the launcher mask can crop the background without clipping the mark.
flutter_icons:
  # image_path: "assets/icon/app_icon_full.png"
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

  # android: "ic_launcher"
  # adaptive_icon_background: "assets/icon/app_icon_background.png"
  # adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # The mark already sits inside the 66% safe zone, so it must not be inset again.
  # adaptive_icon_foreground_inset: 0
  android: true
  ios: true
  # The App Store rejects icons carrying an alpha channel.
  # remove_alpha_ios: true

  windows:
    generate: true
    icon_size: 256
