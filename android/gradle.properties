org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Works around a Windows-only Kotlin incremental-compiler crash when the
# project and Gradle/pub caches live on different drive letters
# (RelocatableFileToPathConverter throws on cross-root relative paths).
kotlin.incremental=false
